name: iOS compile check

# Compiles the app archived against Apple's SDK in Release, unsigned. It does
# not sign, install or test anything. macOS minutes cost about 10x Linux, so
# this runs only when started by hand (Actions tab, or: gh workflow run
# ios-compile.yml --ref <branch>). Same idea as Formetra's ios-compile.yml.
on:
  workflow_dispatch:
  # Temporary: GitHub only offers the manual button once this file is on main,
  # so the first compile of the app-skeleton branch is started by a push.
  # Remove this block when the branch is merged.
  push:
    branches: [app-skeleton]
    paths: ['.github/workflows/ios-compile.yml']

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate
      - name: Archive for iOS device (unsigned, Release)
        working-directory: app
        run: |
          if ! xcodebuild -project AxyomRemote.xcodeproj -scheme AxyomRemote \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/AxyomRemote.xcarchive" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              archive > build.log 2>&1; then
            echo "::group::Errors"
            grep -E "error:" build.log || true
            echo "::endgroup::"
            tail -n 60 build.log
            exit 1
          fi
          grep -E "warning:" build.log | sort -u | head -n 40 || true
          tail -n 3 build.log
          app="$RUNNER_TEMP/AxyomRemote.xcarchive/Products/Applications/AxyomRemote.app"
          echo "--- app bundle contents"
          ls "$app"
          test -f "$app/PrivacyInfo.xcprivacy" && echo "Privacy manifest: included" || { echo "::error::Privacy manifest missing from the app bundle"; exit 1; }
          enc=$(/usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$app/Info.plist" 2>/dev/null || echo missing)
          echo "ITSAppUsesNonExemptEncryption: $enc"
          test "$enc" = "false" || { echo "::error::ITSAppUsesNonExemptEncryption not in the app Info.plist"; exit 1; }
