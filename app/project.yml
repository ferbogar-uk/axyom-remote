# Xcode project definition. Generate the project with: xcodegen generate
# The generated AxyomRemote.xcodeproj is not committed (see .gitignore).
# Same layout as Formetra, but everything here is new: bundle id, signing
# secrets and App Store Connect key are NOT shared with MURY or Formetra.
name: AxyomRemote
options:
  bundleIdPrefix: com.axyom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Sync protocol, crypto, fleet model, voice parser: built and tested on Linux.
  AxyomRemoteCore:
    path: ../core

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AxyomRemote:
    type: application
    platform: iOS
    sources:
      - AxyomRemote
      - Shared
      - WidgetUI
    dependencies:
      - package: AxyomRemoteCore
      - target: NotificationService
      - target: AxyomWidget
    # Push notifications (AXYOM sync server sends APNs alerts; App ID has Push on).
    # The keychain group is shared with the notification extension (session titles).
    entitlements:
      path: AxyomRemote/AxyomRemote.entitlements
      properties:
        aps-environment: production
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.axyom.remote
          - $(AppIdentifierPrefix)com.axyom.remote.shared
    # Extra Info.plist keys, merged with the generated ones (GENERATE_INFOPLIST_FILE).
    info:
      path: AxyomRemote/Info.plist
      properties:
        # axyom:// links from the widget open a session (DeepLink in core).
        CFBundleURLTypes:
          - CFBundleURLName: com.axyom.remote
            CFBundleURLSchemes: [axyom]
        # Export compliance answered once by Ricardo (2026-11-18): standard
        # encryption only (AES-GCM / PBKDF2 / TLS), not distributed in France,
        # no documentation required. NO = exempt, so App Store Connect stops
        # asking on every build ("Missing Compliance").
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # PLACEHOLDER: not registered anywhere yet. HANDOFF step 4: Ricardo
        # decides the bundle id and creates the app in App Store Connect.
        PRODUCT_BUNDLE_IDENTIFIER: com.axyom.remote
        PRODUCT_NAME: AxyomRemote
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: AXYOM
        INFOPLIST_KEY_NSCameraUsageDescription: "AXYOM uses the camera to read the pairing code shown on your PC and to take photos you send to an agent."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "AXYOM asks for Face ID when it opens, because it controls your PC."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AXYOM listens to your voice commands. Recognition runs on the iPhone."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "AXYOM turns your spoken commands into text on the iPhone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        # Signing team is chosen in Xcode / CI secrets. Never commit one here.
        DEVELOPMENT_TEAM: ""

  # Rewrites the server's generic push into agent, conversation and project.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Shared
    dependencies:
      - package: AxyomRemoteCore
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.axyom.remote.shared
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: AXYOM
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axyom.remote.NotificationService
        PRODUCT_NAME: NotificationService
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # Home and lock screen widget: reads what the app saves in the shared keychain item.
  AxyomWidget:
    type: app-extension
    platform: iOS
    sources:
      - AxyomWidget
      - WidgetUI
      - Shared
      - path: AxyomRemote/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: AxyomRemoteCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: AxyomWidget/AxyomWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.axyom.remote.shared
    info:
      path: AxyomWidget/Info.plist
      properties:
        CFBundleDisplayName: AXYOM
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axyom.remote.AxyomWidget
        PRODUCT_NAME: AxyomWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
